name: llama.cpp - Snapdragon SM8850 OpenCL + Hexagon + HTP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4

      - name: Build Snapdragon Android backend
        run: |
          set -eux

          docker run --rm \
            -u "$(id -u):$(id -g)" \
            --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            ghcr.io/snapdragon-toolchain/arm64-android:v0.7 \
            bash -lc '
              set -eux

              cp docs/backend/snapdragon/CMakeUserPresets.json .

              cmake \
                --preset arm64-android-snapdragon-release \
                -B build-snapdragon

              cmake \
                --build build-snapdragon \
                -j$(nproc)

              rm -rf pkg-snapdragon

              cmake \
                --install build-snapdragon \
                --prefix pkg-snapdragon/llama.cpp
            '

      - name: Verify Snapdragon backends
        run: |
          set -eux

          LIBDIR="pkg-snapdragon/llama.cpp/lib"

          echo "===== libraries ====="
          find "$LIBDIR" \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" \
            | sort

          echo
          echo "===== required libraries ====="

          test -f "$LIBDIR/libggml-opencl.so"
          test -f "$LIBDIR/libggml-hexagon.so"
          test -f "$LIBDIR/libggml-cpu.so"

          echo "OpenCL: OK"
          echo "Hexagon: OK"
          echo "CPU: OK"

          echo
          echo "===== HTP libraries ====="

          find "$LIBDIR" \
            -maxdepth 1 \
            -type f \
            -name 'libggml-htp-*.so' \
            -print

          test -n "$(find "$LIBDIR" \
            -maxdepth 1 \
            -type f \
            -name 'libggml-htp-*.so' \
            -print -quit)"

          echo "HTP: OK"

      - name: Show binary architecture
        run: |
          set -eux

          file \
            pkg-snapdragon/llama.cpp/bin/* \
            pkg-snapdragon/llama.cpp/lib/*.so \
            | grep -E 'aarch64|ARM aarch64'

      - name: Package
        run: |
          set -eux

          tar \
            -C pkg-snapdragon \
            -czf llama.cpp-sm8850-opencl-hexagon-htp.tar.gz \
            llama.cpp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama.cpp-sm8850-opencl-hexagon-htp
          path: llama.cpp-sm8850-opencl-hexagon-htp.tar.gz
          retention-days: 30
